# Dev / build compose stack for gismanager.
#
# All Go work happens inside the `dev` container — no host-side GDAL install.
# `make dev` opens an interactive bash; `make build` / `make test-unit` /
# `make lint` / `make vuln` shell into it non-interactively.
#
# A separate `docker-compose.test.yml` (added in a later PR) layers a GeoServer
# + PostGIS stack on top for integration tests.

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: gismanager-dev:local
    working_dir: /workspace
    volumes:
      - .:/workspace
      # Cache Go modules and build outputs between runs to avoid re-downloading
      # on every shell-in.
      - go-mod-cache:/root/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      CGO_ENABLED: "1"
      GOFLAGS: "-buildvcs=false"
    stdin_open: true
    tty: true
    command: bash

volumes:
  go-mod-cache: {}
  go-build-cache: {}
