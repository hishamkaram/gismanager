# golangci-lint v2.x configuration for github.com/hishamkaram/gismanager
# Docs: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      colors: true

linters:
  default: none
  enable:
    # Correctness — must pass
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - errorlint
    - noctx
    - copyloopvar
    # Style / hygiene
    - revive
    - gocritic
    - misspell
    - unconvert
    - prealloc
    # Security
    - gosec

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"
            - "disableStutteringCheck"
        - name: var-naming
        - name: package-comments
        - name: unused-parameter
          disabled: true
    gosec:
      excludes:
        - G104  # unhandled errors — covered by errcheck with our config
        - G304  # file path inclusion — gismanager loads YAML config files
                # from caller-supplied paths; that's the entire feature.
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - prealloc
      # gismanager opens user-supplied paths (the whole point of the tool).
      # G304 (file path inclusion) is excluded above globally; G306
      # (file permissions) is fine for our zipx Extract since we mirror the
      # archive's recorded mode, intentionally.
      - path: internal/zipx/extract\.go
        linters: [gosec]
        text: "G306"
      # gocritic style nits we don't want noise from:
      - linters: [gocritic]
        text: "sloppyReassign"
      - linters: [gocritic]
        text: "paramTypeCombine"
      - linters: [gocritic]
        text: "importShadow.*'suite'"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hishamkaram/gismanager

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
