# Integration test stack for gismanager.
#
# Boots a parameterized GeoServer (default 2.28.0; override via env
# GEOSERVER_VERSION=2.27.4 for the LTS leg) plus a PostGIS 16 database. CI's
# integration matrix runs once per supported GeoServer version against this
# stack.
#
# Local usage:
#     make compose-test-up                          # GeoServer 2.28.0
#     GEOSERVER_VERSION=2.27.4 make compose-test-up # GeoServer 2.27.4 LTS
#     make test-integration                          # runs go test -tags=integration
#     make compose-test-down

services:
  geoserver:
    image: gismanager-geoserver-test:${GEOSERVER_VERSION:-2.28.0}
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        GEOSERVER_VERSION: ${GEOSERVER_VERSION:-2.28.0}
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - docker/env/geoserver.env
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/geoserver/web/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: golang
      POSTGRES_PASSWORD: golang
    ports:
      # Expose 5436 on the host (matches the geoserver-client compose stack
      # so a developer running both projects' integration suites doesn't
      # collide). Tests inside the test-runner container talk to the
      # container hostname `postgis:5432` directly.
      - "5436:5432"
    volumes:
      - ./docker/postgis/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golang -d gis"]
      interval: 5s
      timeout: 5s
      retries: 20

  # test-runner shares the compose network so it talks to `geoserver:8080`
  # and `postgis:5432` directly by service name. `make test-integration`
  # invokes it as `docker compose run --rm -T test-runner go test ...`.
  test-runner:
    image: gismanager-dev:local
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - go-mod-cache:/root/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      CGO_ENABLED: "1"
      GOFLAGS: "-buildvcs=false"
      GISMANAGER_TEST_GEOSERVER_URL: http://geoserver:8080/geoserver
      GISMANAGER_TEST_GEOSERVER_USER: admin
      GISMANAGER_TEST_GEOSERVER_PASSWORD: geoserver
      GISMANAGER_TEST_POSTGIS_HOST: postgis
      GISMANAGER_TEST_POSTGIS_PORT: "5432"
      GISMANAGER_TEST_POSTGIS_DB: gis
      GISMANAGER_TEST_POSTGIS_USER: golang
      GISMANAGER_TEST_POSTGIS_PASSWORD: golang
    depends_on:
      geoserver:
        condition: service_healthy
      postgis:
        condition: service_healthy
    # No default command; `docker compose run test-runner <cmd>` invokes it.
    command: bash

volumes:
  go-mod-cache: {}
  go-build-cache: {}
