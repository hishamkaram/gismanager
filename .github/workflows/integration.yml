name: Integration tests

# End-to-end integration suite. Boots a real GeoServer + PostGIS via
# docker-compose.test.yml, then runs the //go:build integration tests
# inside the test-runner container (which has GDAL via the dev image).
# The matrix runs both GeoServer 2.27.4 LTS and 2.28.0 stable; both legs
# must pass for a PR to merge.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      geoserver:
        description: GeoServer version to test against
        required: false
        default: "2.28.0"
        type: choice
        options:
          - "2.27.4"
          - "2.28.0"
  schedule:
    # Sundays at 03:23 UTC — outside common deploy windows; offset 6 mins
    # from the geoserver/v2 client suite to spread infra load.
    - cron: "23 3 * * 0"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: GeoServer ${{ matrix.geoserver }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        geoserver: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.geoserver)) || fromJSON('["2.27.4", "2.28.0"]') }}
    env:
      GEOSERVER_VERSION: ${{ matrix.geoserver }}
    steps:
      - uses: actions/checkout@v4

      # Cache the manifest-driven testdata fixtures across runs. The cache
      # key is bound to the manifest hash, so any manifest change (new
      # fixture, updated sha) invalidates the cache and triggers a fresh
      # download; otherwise the cache hit is zero-network.
      #
      # Important: fetched fixtures live in `testdata-fetched/` (sibling of
      # `testdata/`), NOT inside `testdata/`. The legacy unit and
      # integration tests walk `./testdata/` recursively and would
      # otherwise pick up the fetched fixtures and break.
      - name: Cache fetched testdata
        uses: actions/cache@v4
        with:
          path: testdata-fetched
          key: testdata-${{ hashFiles('testdata/manifest.sha256') }}
          restore-keys: |
            testdata-

      - name: Fetch testdata fixtures
        run: bash scripts/fetch-testdata.sh

      # buildx + GHA cache: layer-cache the dev and GeoServer image builds
      # across workflow runs. Without this, every PR rebuilds the dev
      # image from scratch (including the apt-install layer), and any
      # transient Ubuntu-mirror outage fails the whole job. With cache,
      # apt only re-runs on Dockerfile changes — far less surface for
      # mirror flakes.
      - uses: docker/setup-buildx-action@v3

      - name: Build dev image (with GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: dev
          tags: gismanager-dev:local
          load: true
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,scope=dev-image,mode=max

      - name: Build GeoServer test image (with GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: gismanager-geoserver-test:${{ matrix.geoserver }}
          load: true
          build-args: |
            GEOSERVER_VERSION=${{ matrix.geoserver }}
          cache-from: type=gha,scope=geoserver-${{ matrix.geoserver }}
          cache-to: type=gha,scope=geoserver-${{ matrix.geoserver }},mode=max

      - name: Boot GeoServer + PostGIS
        run: docker compose -f docker-compose.test.yml up -d --wait --wait-timeout=420 geoserver postgis

      - name: Show GeoServer version
        run: |
          curl -fsS -u admin:geoserver "http://localhost:8080/geoserver/rest/about/version.json" | head -c 1024 || true

      - name: Run integration tests
        run: docker compose -f docker-compose.test.yml run --rm -T test-runner go test -race -tags=integration -timeout=15m -count=1 ./...

      - name: Capture compose logs (on failure)
        if: failure()
        run: |
          set -ex
          mkdir -p ./compose-logs
          docker compose -f docker-compose.test.yml logs --no-color --tail=400 \
            > "./compose-logs/compose-logs-${{ matrix.geoserver }}.txt" 2>&1 || true
          # Keep a tail in the workflow log too for quick triage.
          tail -n 200 "./compose-logs/compose-logs-${{ matrix.geoserver }}.txt" || true

      - name: Upload compose logs artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-${{ matrix.geoserver }}
          path: ./compose-logs/compose-logs-${{ matrix.geoserver }}.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
