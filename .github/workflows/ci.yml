name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All jobs run inside the OSGeo GDAL image so CGo links against the bundled
# libgdal.so.38 — the same constraint local dev satisfies via the dev
# container. apt-installing libgdal-dev on top of this image would shadow
# the bundled GDAL with Ubuntu's older 3.6 (libgdal.so.34), which is
# precisely what the Dockerfile warns against. We only apt-install the small
# set of build helpers (gcc / pkg-config) that the GDAL image doesn't ship.

env:
  GDAL_IMAGE: ghcr.io/osgeo/gdal:ubuntu-small-3.12.4
  # Disable VCS stamping in `go build` — when running inside a container the
  # mounted .git directory is owned by a different uid than the user running
  # go, and git refuses to operate on it ('error obtaining VCS status: exit
  # status 128'). The dev image bakes this into its environment but
  # actions/setup-go inherits its own env, so we set it at the workflow level.
  GOFLAGS: -buildvcs=false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.12.4
    steps:
      - name: Install build essentials
        # build-essential / git come from noble/main, pkg-config from
        # noble/universe — both reliably mirrored. We tolerate
        # apt-get update failure because Ubuntu's noble-security archive
        # occasionally serves files that mismatch its InRelease metadata
        # by one byte (mid-mirror-sync); install only needs the indexes
        # that did fetch. Acquire::Retries handles purely transient HTTP
        # errors at the per-package level.
        run: |
          set -ex
          apt-get -o Acquire::Retries=3 update || \
            echo "apt-get update returned nonzero — proceeding with whatever indexes did fetch"
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential git pkg-config
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.1
          args: --timeout=5m

  unit:
    name: Unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.12.4
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25"]
    steps:
      - name: Install build essentials
        # build-essential / git come from noble/main, pkg-config from
        # noble/universe — both reliably mirrored. We tolerate
        # apt-get update failure because Ubuntu's noble-security archive
        # occasionally serves files that mismatch its InRelease metadata
        # by one byte (mid-mirror-sync); install only needs the indexes
        # that did fetch. Acquire::Retries handles purely transient HTTP
        # errors at the per-package level.
        run: |
          set -ex
          apt-get -o Acquire::Retries=3 update || \
            echo "apt-get update returned nonzero — proceeding with whatever indexes did fetch"
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential git pkg-config
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go${{ matrix.go }}
          path: coverage.out
          retention-days: 14

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.12.4
    steps:
      - name: Install build essentials
        # build-essential / git come from noble/main, pkg-config from
        # noble/universe — both reliably mirrored. We tolerate
        # apt-get update failure because Ubuntu's noble-security archive
        # occasionally serves files that mismatch its InRelease metadata
        # by one byte (mid-mirror-sync); install only needs the indexes
        # that did fetch. Acquire::Retries handles purely transient HTTP
        # errors at the per-package level.
        run: |
          set -ex
          apt-get -o Acquire::Retries=3 update || \
            echo "apt-get update returned nonzero — proceeding with whatever indexes did fetch"
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential git pkg-config
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
